<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oréal Logo" class="logo" />
        <h1 class="site-title">Smart Routine &amp; Product Advisor</h1>
      </header>

      <!-- Category Filter -->
      <div class="search-section">
        <form id="searchForm" class="search-form">
          <label for="searchInput" class="visually-hidden">Search Products</label>
          <input
            id="searchInput"
            name="searchInput"
            type="text"
            placeholder="Search products..."
            autocomplete="off"
          />
          <button type="submit" id="searchBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span class="visually-hidden">Search</span>
          </button>

        </form>
        <select id="categoryFilter">
          <option value="" disabled selected>Choose a Category</option>
          <option value="cleanser">Cleansers</option>
          <option value="moisturizer">Moisturizers & Treatments</option>
          <option value="haircare">Haircare</option>
          <option value="makeup">Makeup</option>
          <option value="hair color">Hair Color</option>
          <option value="hair styling">Hair Styling</option>
          <option value="men's grooming">Men's Grooming</option>
          <option value="suncare">Suncare</option>
          <option value="fragrance">Fragrance</option>
        </select>
      </div>

      <!-- Products Grid -->
      <div id="productsContainer" class="products-grid"></div>

      <!-- Selected Products -->
      <div class="selected-products" id="selectedProductsContainer">
        <h2>Selected Products</h2>
        <div id="selectedProductsList"></div>
        <button id="generateRoutine" class="generate-btn" type="submit">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Routine
        </button>
      </div>

      <!------- Chat Area ------->
      <section class="chatbox">
        <h2>Let's Build Your Routine</h2>
        <div id="chatWindow" class="chat-window"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden">Message</label>
          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about products or routines…"
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="visually-hidden">Send</span>
          </button>
        </form>
      </section>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>

    <!-- RTL Text Direction Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function() {
        const rtlLanguages = new Set([
          'ar', 'he', 'fa', 'ur', 'ps', 'sd', 'ks', 'ku', 'yi', 'ug', 'dv', 'nqo', 'syr', 'azb', 'ckb'
        ]);

        function isRtlLanguage(value) {
          if (!value) return false;
          const lang = value.split(/[-_]/)[0].toLowerCase();
          return rtlLanguages.has(lang);
        }

        function detectTranslateLanguage() {
          const htmlLang = document.documentElement.lang;
          if (isRtlLanguage(htmlLang)) return true;

          const translateSelect = document.querySelector('.goog-te-combo');
          if (translateSelect && isRtlLanguage(translateSelect.value)) return true;

          const metaLang = document.querySelector('meta[http-equiv="content-language"]');
          if (metaLang && isRtlLanguage(metaLang.content)) return true;

          return false;
        }

        function updateDirection() {
          const isRtl = detectTranslateLanguage();
          document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
        }

        function observeLanguageChanges() {
          const observer = new MutationObserver(() => updateDirection());
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
          observer.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['lang'] });
        }

        updateDirection();
        observeLanguageChanges();
        setInterval(updateDirection, 1000);
      })();
    </script>
  </body>
</html>
